# Optional CPU verification; model suggestions always require human review.
# Explicit CPU-only opt-in. Base compose.yaml keeps LLM_PROVIDER=none.
services:
  ollama:
    build:
      context: ./infra/ollama
    image: incidentiq-ollama-cpu:0.6.8
    platform: linux/amd64
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ollama_data:/root/.ollama
    cpus: 4
    mem_limit: 2500m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  worker:
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_MODEL: qwen3:0.6b
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_TIMEOUT_SECONDS: "30"
    depends_on:
      ollama:
        condition: service_healthy
volumes:
  ollama_data:
