apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- api.yaml
- publisher.yaml
- worker.yaml
- frontend.yaml
- postgres.yaml
- kafka.yaml
- ingestion.yaml
- ../../../runbooks
configMapGenerator:
- name: incidentiq-config
  literals:
  - POSTGRES_HOST=postgres
  - POSTGRES_PORT=5432
  - POSTGRES_DB=incidentiq_k8s_local
  - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
  - KAFKA_GROUP_ID=incidentiq-k8s-worker-v1
  - LLM_PROVIDER=none
  - OMP_NUM_THREADS=1
  - OPENBLAS_NUM_THREADS=1
  - PYTHONPATH=/app
- name: bootstrap
  files:
  - wait.py
- name: frontend-nginx
  files:
  - default.conf=nginx.conf
