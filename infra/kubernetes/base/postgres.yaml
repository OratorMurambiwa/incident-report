apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: incidentiq
  ports:
  - name: tcp
    port: 5432
    targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: incidentiq
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: postgres
        image: pgvector/pgvector:0.8.7-pg16-trixie
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 384Mi
        envFrom:
        - configMapRef:
            name: incidentiq-config
        - secretRef:
            name: database-credentials
        args:
        - postgres
        - -c
        - shared_buffers=32MB
        - -c
        - max_connections=40
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        startupProbe:
          exec: &id002
            command:
            - /bin/sh
            - -ec
            - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe: &id003
          exec: *id002
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe: *id003
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - name: tcp
          containerPort: 5432
  serviceName: postgres
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
