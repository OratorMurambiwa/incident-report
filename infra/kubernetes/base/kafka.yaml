apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: incidentiq
  ports:
  - name: tcp
    port: 29092
    targetPort: 29092
  clusterIP: None
  publishNotReadyAddresses: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: kafka
      app.kubernetes.io/part-of: incidentiq
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: kafka
        image: apache/kafka:3.9.1
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 200m
            memory: 384Mi
          limits:
            cpu: '1'
            memory: 640Mi
        env:
        - name: CLUSTER_ID
          value: MkU3OEVBNTcwNTJENDM2Qk
        - name: KAFKA_NODE_ID
          value: '1'
        - name: KAFKA_PROCESS_ROLES
          value: broker,controller
        - name: KAFKA_LISTENERS
          value: INTERNAL://:29092,CONTROLLER://:9093
        - name: KAFKA_ADVERTISED_LISTENERS
          value: INTERNAL://kafka:29092
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: INTERNAL
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 1@kafka-0.kafka:9093
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: '1'
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: '0'
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: 'false'
        - name: KAFKA_LOG_DIRS
          value: /var/lib/kafka/data
        - name: KAFKA_HEAP_OPTS
          value: -Xms128m -Xmx256m
        - name: KAFKA_NUM_NETWORK_THREADS
          value: '2'
        - name: KAFKA_NUM_IO_THREADS
          value: '2'
        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data
        startupProbe:
          exec: &id002
            command:
            - /bin/bash
            - -ec
            - exec 3<>/dev/tcp/127.0.0.1/29092
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          exec: *id002
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /opt/kafka/bin/kafka-topics.sh
            - --bootstrap-server
            - localhost:29092
            - --list
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 3
        ports:
        - name: tcp
          containerPort: 29092
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
  serviceName: kafka
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
