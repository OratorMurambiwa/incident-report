apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: incidentiq
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: frontend
      app.kubernetes.io/part-of: incidentiq
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: frontend
        image: incidentiq-frontend:local
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 64Mi
        ports:
        - name: http
          containerPort: 80
        startupProbe:
          httpGet: &id002
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe: &id003
          httpGet: *id002
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe: *id003
        volumeMounts:
        - name: nginx
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
      volumes:
      - name: nginx
        configMap:
          name: frontend-nginx
  strategy:
    type: Recreate
