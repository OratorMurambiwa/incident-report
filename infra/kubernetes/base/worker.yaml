apiVersion: v1
kind: Service
metadata:
  name: worker
spec:
  selector:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: incidentiq
  ports:
  - name: http
    port: 8001
    targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: worker
      app.kubernetes.io/part-of: incidentiq
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: worker
        image: incidentiq-worker:local
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1024Mi
        ports:
        - name: http
          containerPort: 8001
        envFrom: &id004
        - configMapRef:
            name: incidentiq-config
        - secretRef:
            name: database-credentials
        startupProbe:
          httpGet: &id002
            path: /metrics
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe: &id003
          httpGet: *id002
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe: *id003
      initContainers:
      - name: wait-evidence
        image: incidentiq-worker:local
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        command:
        - python
        - /bootstrap/wait.py
        - evidence
        envFrom: *id004
        volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        - name: runbooks
          mountPath: /runbooks
          readOnly: true
      - name: wait-topic
        image: incidentiq-worker:local
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        command:
        - python
        - /bootstrap/wait.py
        - topic
        envFrom: *id004
        volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
      volumes:
      - name: bootstrap
        configMap:
          name: bootstrap
      - name: runbooks
        configMap:
          name: runbooks
  strategy:
    type: Recreate
