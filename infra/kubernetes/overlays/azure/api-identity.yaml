apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    metadata:
      labels:
        azure.workload.identity/use: 'true'
    spec:
      serviceAccountName: incidentiq-keyvault
      volumes:
      - name: keyvault
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: incidentiq-keyvault
      containers:
      - name: api
        volumeMounts:
        - &id001
          name: keyvault
          mountPath: /mnt/keyvault
          readOnly: true
      initContainers:
      - name: wait-database
        volumeMounts:
        - *id001
