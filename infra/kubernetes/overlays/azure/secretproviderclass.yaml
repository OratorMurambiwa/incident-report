apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: incidentiq-keyvault
spec:
  provider: azure
  secretObjects:
  - secretName: database-credentials
    type: Opaque
    data:
    - objectName: postgres-user
      key: POSTGRES_USER
    - objectName: postgres-password
      key: POSTGRES_PASSWORD
  parameters:
    usePodIdentity: 'false'
    clientID: 00000000-0000-0000-0000-000000000000
    keyvaultName: replace-vault
    tenantId: 00000000-0000-0000-0000-000000000000
    objects: "array:\n  - |\n    objectName: incidentiq-postgres-user\n    objectType:\
      \ secret\n    objectAlias: postgres-user\n  - |\n    objectName: incidentiq-postgres-password\n\
      \    objectType: secret\n    objectAlias: postgres-password\n"
