global:
  scrape_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: incidentiq-api
    scrape_interval: 5s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
  - job_name: incidentiq-worker
    scrape_interval: 5s
    static_configs:
      - targets: ["worker:8001"]
