rule_files:
- /etc/prometheus/alerts.yml
evaluation_interval: 5s
tests:
- interval: 5s
  input_series:
  - series: http_server_requests_seconds_count{job="incidentiq-api",uri="/api/dev/simulate/failure",status="500"}
    values: 0+10x24
  alert_rule_test:
  - eval_time: 1m
    alertname: IncidentIQHighHttp500Rate
    exp_alerts:
    - exp_labels:
        job: incidentiq-api
        uri: /api/dev/simulate/failure
        severity: critical
        service: incidentiq-api
      exp_annotations:
        summary: HTTP 500 server errors on /api/dev/simulate/failure
        description: More than 20% HTTP 500 responses, with at least three errors
          in one minute. Investigate application exceptions and dependencies.
- interval: 5s
  input_series:
  - series: http_server_requests_seconds_count{job="incidentiq-api",uri="/api/dev/simulate/latency",status="200"}
    values: 0+5x24
  - series: http_server_requests_seconds_bucket{job="incidentiq-api",uri="/api/dev/simulate/latency",le="0.5"}
    values: 0+0x24
  - series: http_server_requests_seconds_bucket{job="incidentiq-api",uri="/api/dev/simulate/latency",le="1"}
    values: 0+5x24
  - series: http_server_requests_seconds_bucket{job="incidentiq-api",uri="/api/dev/simulate/latency",le="+Inf"}
    values: 0+5x24
  alert_rule_test:
  - eval_time: 1m
    alertname: IncidentIQHighP95Latency
    exp_alerts:
    - exp_labels:
        job: incidentiq-api
        uri: /api/dev/simulate/latency
        severity: warning
        service: incidentiq-api
      exp_annotations:
        summary: High p95 HTTP latency on /api/dev/simulate/latency
        description: HTTP p95 exceeds 500 ms for 15 seconds. Inspect resource saturation,
          query duration and downstream dependencies.
- interval: 5s
  input_series:
  - series: up{job="incidentiq-worker",instance="worker:8001"}
    values: 0+0x24
  alert_rule_test:
  - eval_time: 1m
    alertname: IncidentIQServiceUnavailable
    exp_alerts:
    - exp_labels:
        job: incidentiq-worker
        instance: worker:8001
        severity: critical
        service: incidentiq-worker
      exp_annotations:
        summary: 'Service unavailable: incidentiq-worker'
        description: Prometheus cannot scrape this service for 30 seconds. Check its
          process, network and dependencies.
- interval: 5s
  input_series:
  - series: http_server_requests_seconds_count{job="incidentiq-api",uri="/api/incidents",status="500"}
    values: 0+10x24
  - series: http_server_requests_seconds_bucket{job="incidentiq-api",uri="/api/incidents",le="0.5"}
    values: 0+0x24
  - series: http_server_requests_seconds_bucket{job="incidentiq-api",uri="/api/incidents",le="1"}
    values: 0+10x24
  - series: http_server_requests_seconds_bucket{job="incidentiq-api",uri="/api/incidents",le="+Inf"}
    values: 0+10x24
  - series: http_server_requests_seconds_count{job="incidentiq-api",uri="/api/incidents/{id}/diagnosis",status="500"}
    values: 0+10x24
  - series: http_server_requests_seconds_bucket{job="incidentiq-api",uri="/api/incidents/{id}/diagnosis",le="0.5"}
    values: 0+0x24
  - series: http_server_requests_seconds_bucket{job="incidentiq-api",uri="/api/incidents/{id}/diagnosis",le="1"}
    values: 0+10x24
  - series: http_server_requests_seconds_bucket{job="incidentiq-api",uri="/api/incidents/{id}/diagnosis",le="+Inf"}
    values: 0+10x24
  - series: http_server_requests_seconds_count{job="incidentiq-api",uri="/api/alerts/alertmanager",status="500"}
    values: 0+10x24
  - series: http_server_requests_seconds_bucket{job="incidentiq-api",uri="/api/alerts/alertmanager",le="0.5"}
    values: 0+0x24
  - series: http_server_requests_seconds_bucket{job="incidentiq-api",uri="/api/alerts/alertmanager",le="1"}
    values: 0+10x24
  - series: http_server_requests_seconds_bucket{job="incidentiq-api",uri="/api/alerts/alertmanager",le="+Inf"}
    values: 0+10x24
  - series: http_server_requests_seconds_count{job="incidentiq-api",uri="/actuator/prometheus",status="500"}
    values: 0+10x24
  - series: http_server_requests_seconds_bucket{job="incidentiq-api",uri="/actuator/prometheus",le="0.5"}
    values: 0+0x24
  - series: http_server_requests_seconds_bucket{job="incidentiq-api",uri="/actuator/prometheus",le="1"}
    values: 0+10x24
  - series: http_server_requests_seconds_bucket{job="incidentiq-api",uri="/actuator/prometheus",le="+Inf"}
    values: 0+10x24
  alert_rule_test:
  - eval_time: 1m
    alertname: IncidentIQHighHttp500Rate
    exp_alerts: []
  - eval_time: 1m
    alertname: IncidentIQHighP95Latency
    exp_alerts: []
- interval: 5s
  input_series:
  - series: http_server_requests_seconds_count{job="incidentiq-api",uri="/api/dev/simulate/failure",status="500"}
    values: 0+0x5 1+0x18
  alert_rule_test:
  - eval_time: 1m
    alertname: IncidentIQHighHttp500Rate
    exp_alerts: []
