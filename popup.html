<!DOCTYPE html>
<html>
  <head>
    <title>NeetCode Sync Setup</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 10px; width: 250px; }
      input { width: 100%; margin-top: 5px; margin-bottom: 10px; }
      button { width: 100%; padding: 6px; background-color: #2b5fff; color: white; border: none; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h3>Setup</h3>
    <label>GitHub Token:</label>
    <input id="token" type="password" placeholder="ghp_xxxxxx" />

    <label>Repo (user/repo):</label>
    <input id="repo" placeholder="username/repository" />

    <button id="save">Save Settings</button>

    <script src="popup.js"></script>
  </body>
</html>
