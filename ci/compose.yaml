# CI-only ephemeral database: no host ports, external networks or persistent volumes.
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    environment:
      POSTGRES_DB: incidentiq_api_test
      POSTGRES_USER: incidentiq_ci
      POSTGRES_PASSWORD: ${CI_POSTGRES_PASSWORD:?CI wrapper generates an ephemeral password}
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=40]
    tmpfs:
      - /var/lib/postgresql/data:size=384m
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 3s
      timeout: 3s
      retries: 40
