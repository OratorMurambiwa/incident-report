# Separate project; only PostgreSQL/network are shared with the normal platform.
name: incidentiq-bench
x-db: &db
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${BENCH_DB:?Run scripts/benchmark.py}
  POSTGRES_USER: ${POSTGRES_USER:?}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
services:
  bench-api:
    image: incidentiq-api:local
    environment:
      <<: *db
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m -XX:ActiveProcessorCount=2
      KAFKA_BOOTSTRAP_SERVERS: bench-kafka:9092
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
    ports: ["127.0.0.1:18080:8080"]
    cpus: 1.5
    mem_limit: 512m
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/actuator/health]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [platform]
  bench-publisher:
    image: incidentiq-api:local
    environment:
      <<: *db
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx128m -XX:ActiveProcessorCount=1
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      OUTBOX_PUBLISHER_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: bench-kafka:9092
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
    cpus: 0.5
    mem_limit: 384m
    networks: [platform]
  bench-worker:
    image: incidentiq-worker:local
    environment:
      <<: *db
      KAFKA_BOOTSTRAP_SERVERS: bench-kafka:9092
      KAFKA_GROUP_ID: ${BENCH_RUN:?}
      LLM_PROVIDER: none
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes: ["./runbooks:/runbooks:ro"]
    cpus: 1
    mem_limit: 1024m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [platform]
  bench-kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://bench-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@bench-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_MESSAGE_TIMESTAMP_TYPE: LogAppendTime
      KAFKA_LOG_DIRS: /tmp/incidentiq-bench-kafka
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 2
    cpus: 1
    mem_limit: 640m
    healthcheck:
      test: [CMD, /bin/bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/9092"]
      interval: 3s
      timeout: 5s
      retries: 40
    networks: [platform]
  bench-observer:
    image: incidentiq-worker:local
    environment:
      <<: *db
      BENCH_RUN: ${BENCH_RUN:?}
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: bench-kafka:9092
    volumes: ["./benchmarks:/bench:ro", "${BENCH_WORK:?}:/work", "${BENCH_RESULTS:?}:/results"]
    cpus: 0.5
    mem_limit: 128m
    networks: [platform]
  k6:
    image: grafana/k6:1.3.0
    user: "0:0"
    environment:
      K6_NO_USAGE_REPORT: "true"
      BENCH_RUN: ${BENCH_RUN:?}
    volumes: ["./benchmarks:/bench:ro", "${BENCH_WORK:?}:/work", "${BENCH_RESULTS:?}:/results"]
    cpus: 0.5
    mem_limit: 256m
    networks: [platform]
networks:
  platform:
    external: true
    name: ${BENCH_NETWORK:?}
