# Entirely private test network and run-specific database/topic. Never use normal services.
x-db: &db
  POSTGRES_HOST: fault-postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${FAULT_DB:?Use scripts/faults.py}
  POSTGRES_USER: incidentiq_fault
  POSTGRES_PASSWORD: ${FAULT_PASSWORD:?Ephemeral runner environment}
x-worker: &worker
  image: incidentiq-worker:local
  command: [python, /faults/worker_adapter.py]
  environment:
    <<: *db
    PYTHONPATH: /app
    FAULT_TOPIC: ${FAULT_TOPIC:?}
    KAFKA_BOOTSTRAP_SERVERS: fault-kafka:9092
    KAFKA_GROUP_ID: ${FAULT_RUN:?}
    LLM_PROVIDER: none
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
  volumes: ["./faults:/faults:ro", "./runbooks:/runbooks:ro", "${FAULT_CONTROL:?}:/control"]
  cpus: 1
  mem_limit: 1024m
  restart: unless-stopped
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/', timeout=2)"]
    interval: 3s
    timeout: 3s
    retries: 50
services:
  fault-postgres:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    environment:
      POSTGRES_DB: ${FAULT_DB:?}
      POSTGRES_USER: incidentiq_fault
      POSTGRES_PASSWORD: ${FAULT_PASSWORD:?}
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=30]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    cpus: 0.5
    mem_limit: 384m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U incidentiq_fault -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 40
  fault-kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://fault-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@fault-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_GROUP_MIN_SESSION_TIMEOUT_MS: 6000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 2
    volumes: ["kafkadata:/var/lib/kafka/data"]
    cpus: 1
    mem_limit: 640m
    healthcheck:
      test: [CMD, /bin/bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/9092"]
      interval: 3s
      timeout: 3s
      retries: 40
  fault-api:
    image: incidentiq-api:local
    environment:
      <<: *db
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m -XX:ActiveProcessorCount=2
      KAFKA_BOOTSTRAP_SERVERS: fault-kafka:9092
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
    ports: ["127.0.0.1:18081:8080"]
    cpus: 1.5
    mem_limit: 512m
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/actuator/health]
      interval: 3s
      timeout: 3s
      retries: 40
  fault-publisher:
    image: incidentiq-api:local
    environment:
      <<: *db
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx128m -XX:ActiveProcessorCount=1
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      OUTBOX_PUBLISHER_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: fault-kafka:9092
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
    cpus: 0.5
    mem_limit: 384m
    restart: unless-stopped
  fault-worker:
    <<: *worker
  fault-peer:
    <<: *worker
  fault-driver:
    image: incidentiq-worker:local
    command: [python, -c, "import time; time.sleep(14400)"]
    environment:
      <<: *db
      PYTHONPATH: /app
      FAULT_TOPIC: ${FAULT_TOPIC:?}
      KAFKA_BOOTSTRAP_SERVERS: fault-kafka:9092
      KAFKA_GROUP_ID: ${FAULT_RUN:?}
    volumes: ["./faults:/faults:ro", "${FAULT_CONTROL:?}:/control"]
    cpus: 0.5
    mem_limit: 128m
volumes:
  pgdata:
  kafkadata:
