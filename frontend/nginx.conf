server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /healthz { access_log off; return 200 'ok'; }
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://api:8080;
        proxy_pass $api$request_uri;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
